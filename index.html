<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vercel Deployment Test</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5efe6;
        --panel: rgba(255, 255, 255, 0.88);
        --text: #1f2937;
        --accent: #c2410c;
        --border: rgba(31, 41, 55, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(194, 65, 12, 0.18), transparent 35%),
          linear-gradient(135deg, #f8fafc, var(--bg));
        color: var(--text);
        font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      main {
        width: min(680px, 100%);
        padding: 40px 32px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(8px);
      }

      p {
        margin: 0 0 16px;
        line-height: 1.7;
      }

      .eyebrow {
        margin-bottom: 12px;
        color: var(--accent);
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 5vw, 3.6rem);
        line-height: 1.05;
      }

      code {
        padding: 0.15em 0.45em;
        border-radius: 999px;
        background: rgba(31, 41, 55, 0.08);
        font-size: 0.95em;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Vercel Smoke Test</p>
      <h1>Deploy works.</h1>
      <p>如果你能在 Vercel 上看到这个页面，说明当前仓库的静态页面部署链路已经打通。</p>
      <p>当前测试入口文件是 <code>index.html</code>，位于项目根目录。</p>
      <p>下一步你可以继续接入自己的正式页面，或者再补一个 <code>vercel.json</code> 做更明确的部署控制。</p>
    </main>
  </body>
</html>
